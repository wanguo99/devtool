# Compatibility configuration: add only this file and the common executable.
# Existing project backend modules/scripts remain responsible for domain operations.
# Pass legacy-only options after --. No target address or credential is configured.
[project]
name = "zippos"

[defaults]
module = "all"
env = { PYTHONPATH = "tools/devtool/src" }

[commands]
"beta.all" = ["python3", "-m", "zippos_devtool", "beta", "all"]
"beta.backup" = ["python3", "-m", "zippos_devtool", "beta", "backup"]
"beta.check" = ["python3", "-m", "zippos_devtool", "beta", "check"]
"beta.health" = ["python3", "-m", "zippos_devtool", "beta", "health"]
"beta.history" = ["python3", "-m", "zippos_devtool", "beta", "history"]
"beta.prepare" = ["python3", "-m", "zippos_devtool", "beta", "prepare"]
"beta.recover" = ["python3", "-m", "zippos_devtool", "beta", "recover"]
"beta.rollback" = ["python3", "-m", "zippos_devtool", "beta", "rollback"]
"beta.status" = ["python3", "-m", "zippos_devtool", "beta", "status"]
"beta.stop" = ["python3", "-m", "zippos_devtool", "beta", "stop"]
"beta.up" = ["python3", "-m", "zippos_devtool", "beta", "up"]
"beta.upgrade" = ["python3", "-m", "zippos_devtool", "beta", "upgrade"]
"build.all" = ["python3", "-m", "zippos_devtool", "build", "all"]
"build.backend" = ["python3", "-m", "zippos_devtool", "build", "backend"]
"build.customer-mp" = ["python3", "-m", "zippos_devtool", "build", "customer-mp"]
"build.images" = ["python3", "-m", "zippos_devtool", "build", "images"]
"build.merchant-mp" = ["python3", "-m", "zippos_devtool", "build", "merchant-mp"]
"build.miniapp" = ["python3", "-m", "zippos_devtool", "build", "miniapp"]
"build.web" = ["python3", "-m", "zippos_devtool", "build", "web"]
"deploy.all" = ["python3", "-m", "zippos_devtool", "deploy", "all"]
"diagnose.all" = ["python3", "-m", "zippos_devtool", "diagnose", "all"]
"diagnose.collect" = ["python3", "-m", "zippos_devtool", "diagnose", "collect"]
"diagnose.list" = ["python3", "-m", "zippos_devtool", "diagnose", "list"]
"diagnose.prune" = ["python3", "-m", "zippos_devtool", "diagnose", "prune"]
"doctor.all" = ["python3", "-m", "zippos_devtool", "doctor", "all"]
"doctor.backend" = ["python3", "-m", "zippos_devtool", "doctor", "backend"]
"doctor.miniapp" = ["python3", "-m", "zippos_devtool", "doctor", "miniapp"]
"doctor.web" = ["python3", "-m", "zippos_devtool", "doctor", "web"]
"legacy-help" = ["python3", "-m", "zippos_devtool", "--help"]
"legacy-history" = ["python3", "-m", "zippos_devtool", "history"]
"legacy-plan" = ["python3", "-m", "zippos_devtool", "plan"]
"logs.all" = ["python3", "-m", "zippos_devtool", "logs", "all"]
"logs.backend" = ["python3", "-m", "zippos_devtool", "logs", "backend"]
"logs.web" = ["python3", "-m", "zippos_devtool", "logs", "web"]
"notify.all" = ["python3", "-m", "zippos_devtool", "notify", "all"]
"notify.dispatch" = ["python3", "-m", "zippos_devtool", "notify", "dispatch"]
"notify.retry" = ["python3", "-m", "zippos_devtool", "notify", "retry"]
