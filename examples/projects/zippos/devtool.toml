"remote.all" = ["python3", "-m", "zippos_devtool", "remote", "all"]
"remote.doctor" = ["python3", "-m", "zippos_devtool", "remote", "doctor"]
"remote.prepare" = ["python3", "-m", "zippos_devtool", "remote", "prepare"]
"rollback.all" = ["python3", "-m", "zippos_devtool", "rollback", "all"]
"status.all" = ["python3", "-m", "zippos_devtool", "status", "all"]
"test.all" = ["python3", "-m", "zippos_devtool", "test", "all"]
