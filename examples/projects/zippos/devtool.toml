# Direct engine definitions for independent tooling/validation unit tests.
[tasks."test.tool"]
commands = [["python3", "-m", "unittest", "discover", "-s", "scripts", "-p", "test_devtool*.py"]]

[tasks."test.validation"]
commands = [["python3", "-m", "unittest", "discover", "-s", "scripts/acceptance", "-p", "test_*.py"]]
