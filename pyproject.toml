[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "devtool-core"
version = "0.8.0"
description = "A project-defined engineering task runner for builds, tests and deployment"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
devtool = "devtool_core.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
